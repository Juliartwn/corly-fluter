name: corly
description: "Coral Bleaching Detection App using YOLOv10"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # TensorFlow Lite for YOLOv10 inference
  tflite_flutter: ^0.11.0

  # Image & Video Processing
  image_picker: ^1.0.7
  video_player: ^2.8.2
  video_thumbnail: ^0.5.3
  camera: ^0.10.5+9
  image: ^4.1.7

  # File & Path Management
  path_provider: ^2.1.2
  path: ^1.9.0

  # CSV Export
  csv: ^6.0.0

  # Permissions
  permission_handler: ^11.2.0

  # UI Components
  flutter_spinkit: ^5.2.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true

  # Assets folder untuk model dan gambar
  assets:
    - assets/models/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo.png"
  remove_alpha_ios: true
